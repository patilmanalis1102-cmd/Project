<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Student Internship Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f0f4ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:#fff;
    padding:35px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#0d47a1;
    margin-bottom:25px;
}

label{
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    margin:8px 0 18px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    background:#0d47a1;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

p{
    text-align:center;
    margin-top:15px;
}

a{
    color:#0d47a1;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>Student Login</h2>

<form method="POST" action="/login">

    <label>User Type</label>

<select name="user_type" required>
    <option value="">Select User Type</option>
    <option value="student">Student</option>
    <option value="admin">Admin</option>
</select>

    <label>Email</label>
    <input type="email"
           id="email"
           name="email"
           placeholder="Enter Email"
           required>

    <label>Password</label>
    <input type="password"
           id="password"
           name="password"
           placeholder="Enter Password"
           required>

    <button type="submit">
        Login
    </button>

</form>

<p>
    Don't have an account?
    <a href="/register">Register Here</a>
</p>

</div>

</body>
</html>
